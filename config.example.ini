; Скопируйте в config.ini. Ключи доступа хранятся в .env, а не здесь.

[source]
; Адрес API «Работа в России» для региона 39
url = http://opendata.trudvsem.ru/api/v1/vacancies/region/39
; Размер страницы (API отдаёт не больше 100) и максимум вакансий за запуск рабочего режима
page_size = 100
max_vacancies = 200
; API отвечает медленно: таймаут на страницу и число повторов
timeout_seconds = 150
retries = 3

[schedule]
; interval — каждые interval_minutes минут; daily — раз в сутки в daily_at
mode = interval
interval_minutes = 360
daily_at = 06:00

[ai]
; auto = cloudflare, затем openai (если задан llm_base_url), затем ollama.
; Можно задать один движок или цепочку: cloudflare, openai, clef, clef-flash, ollama, none
engine = auto
cloudflare_model = @cf/google/gemma-4-26b-a4b-it
ollama_url = http://127.0.0.1:11434
ollama_model = qwen3.5:4b
; 0 — модель занимает половину ядер, чтобы компьютер оставался отзывчивым
ollama_threads = 0
num_ctx = 4096
timeout_seconds = 300
retries = 2
; Любой OpenAI-совместимый сервис (движок openai): адрес вида https://host/v1 и имя модели.
; Ключ — переменная LLM_API_KEY в .env. llm_extra — дополнительные параметры запроса в JSON.
llm_base_url =
llm_model =
llm_extra =
; Clef: минимальная вероятность варианта, чтобы ответ считался уверенным
clef_threshold = 0.6
; Кэш ответов ИИ: повторный запуск на тех же данных не тратит квоту
cache = .cache/ai.sqlite

[report]
dir = data
; Добавлять ли в отчёт необязательные наблюдения (hints) отдельным массивом
hints = true

[policy]
; Вилка зарплаты (максимум к минимуму), с которой она считается неинформативной; ниже — только подсказка
wide_range_ratio = 3.0
hint_range_ratio = 2.0
; Расхождение суммы в тексте с вилкой: без подтверждения ИИ и с подтверждением
pay_conflict = 0.25
pay_conflict_confirmed = 0.05
pay_hint = 0.15
; Сумма меньше этой не похожа на месячную зарплату
min_monthly_pay = 5000
; Часов в неделю, с которых график соответствует полной занятости
full_time_hours = 35
