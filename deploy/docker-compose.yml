# Сервис по расписанию и локальная модель.
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml exec ollama ollama pull qwen3.5:4b
services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
  vacancy-clarity:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      VC_OLLAMA_URL: http://ollama:11434
    volumes:
      - ../data:/app/data
    depends_on:
      - ollama
volumes:
  ollama:
